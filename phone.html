  :root{
    --ink:#171717; --paper:#f8f7ed;
    --bg:#e8ef59;                       /* cambia por modo, como el botón * de perritoslindos.com */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:240px;height:282px;overflow:hidden;background:var(--ink);
    font-family:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);user-select:none}
  #app{position:relative;width:240px;height:282px;overflow:hidden;background:var(--bg);transition:background-color .45s ease}

  /* perrito */
  #dog{position:absolute;inset:0;width:240px;height:282px;display:block}
  #dog .fig{fill:var(--ink);transform-box:view-box;transform-origin:451.8px 140px}
  #app.grr #dog .fig{animation:growl .09s linear infinite}
  @keyframes growl{0%{transform:translate(0,0)}25%{transform:translate(-.9px,.4px)}50%{transform:translate(.8px,-.4px)}75%{transform:translate(-.4px,-.4px)}}

  /* menú: PL · BPM · MEZCLA · TAP */
  #menu{position:absolute;left:0;right:0;top:10px;display:flex;justify-content:center;gap:13px;
    font-weight:900;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase}
  #menu span{opacity:.32;transition:opacity .25s;padding-bottom:2px;border-bottom:2px solid transparent}
  #menu span.on{opacity:1;border-bottom-color:var(--ink)}

  /* bienvenida */
  .welcome{position:absolute;left:0;right:0;transition:opacity .35s}
  #title{top:212px;text-align:center;font-weight:900;font-size:35px;letter-spacing:-1.6px;line-height:1}
  #title small{font-size:35px}
  #wHint{top:244px;text-align:center;font-weight:700;font-size:10.5px;letter-spacing:.3px;opacity:.75}
  #count{left:auto;right:10px;bottom:7px;font-weight:700;font-size:9.5px;letter-spacing:.6px;
    border:1px solid var(--ink);padding:1px 4px;opacity:.85}

  /* modos */
  .mode{position:absolute;left:0;right:0;transition:opacity .35s}
  #bpm{top:28px;text-align:center;font-weight:900;font-size:52px;letter-spacing:-2px;line-height:1;
    font-variant-numeric:tabular-nums;transition:opacity .3s}
  #bpm small{font-size:11px;letter-spacing:1.4px;margin-left:3px;opacity:.6}
  #app.dim #bpm{opacity:.3}
  #hint{top:86px;text-align:center;font-weight:700;font-size:11.5px;letter-spacing:.2px;min-height:14px}
  #phase{left:52px;right:52px;top:108px;height:2px;background:rgba(23,23,23,.25)}
  #phase::before{content:"";position:absolute;left:50%;top:-4px;width:2px;height:10px;margin-left:-1px;background:var(--ink)}
  #phase i{position:absolute;top:-4px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--ink);
    left:50%;opacity:0;transition:left .25s ease,opacity .2s}
  #app.mixing #phase i{opacity:1}

  /* escucha */
  #ear{left:auto;right:10px;bottom:9px;font-weight:700;font-size:9.5px;letter-spacing:.6px;display:flex;align-items:center;gap:5px}
  #ear b{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink)}
  #app.listening #ear b{background:var(--ink);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}

  /* burbujas */
  #bubble{position:absolute;right:10px;top:124px;padding:9px 13px 10px;border-radius:16px;
    font-weight:900;font-size:22px;line-height:1;white-space:nowrap;
    transform-origin:0 70%;transform:scale(.4);opacity:0;transition:transform .18s cubic-bezier(.3,1.6,.5,1),opacity .12s}
  #bubble::after{content:"";position:absolute;left:-9px;top:55%;border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:10px solid var(--paper)}
  #bubble.show{transform:scale(1);opacity:1}
  #bubble.barf{background:var(--paper);color:var(--ink)}
  #bubble.grrr{background:var(--ink);color:var(--paper);border-radius:6px;font-style:italic;letter-spacing:2px}
  #bubble.grrr::after{border-right-color:var(--ink)}
  #bubble.grrr.show span{display:inline-block;animation:growl2 .07s linear infinite}
  @keyframes growl2{0%{transform:translate(0,0)}33%{transform:translate(-1.5px,1px)}66%{transform:translate(1.5px,-1px)}}

  #toast{position:absolute;left:50%;top:132px;transform:translate(-50%,0);background:var(--ink);color:var(--paper);
    font-weight:700;font-size:11.5px;padding:6px 10px;border-radius:6px;opacity:0;transition:opacity .2s;white-space:nowrap}
  #toast.show{opacity:1}

  .hide{opacity:0 !important;pointer-events:none}
</style>
</head>

<script>
/* perrito BPM — motor de análisis.
 * JS puro, sin DOM ni red: corre igual en el R1 y en Node (tests).
 *
 * Dos bandas:
 *  - Graves (35–150 Hz): tempo por autocorrelación y posición del bombo. Robusto, pero dos
 *    bombos superpuestos interfieren entre sí, así que no sirve para medir desfases chicos.
 *  - Agudos (> 2 kHz): transientes cortos (click del bombo, hats, claps). Ahí un desfase de
 *    10–40 ms aparece como un golpe duplicado, y se mide el desfase entre A y B.
 */
(function (root) {
  'use strict';

  const DEFAULTS = {
    hopSec: 0.005,           // ~200 frames de envolvente por segundo
    lpHz: 150, hpHz: 35,     // banda del bombo
    hfHz: 2000,              // banda de transientes
    bpmMin: 85, bpmMax: 175, bpmStep: 0.1,
    tempoWindowSec: 8,       // ventana de autocorrelación
    phaseWindowSec: 4,       // ventana del histograma de fase
    phaseBins: 96,
    updateSec: 0.25,
    minConfidence: 0.3,
    levelGateDb: -62,        // por debajo: silencio
    medianN: 5,
    onsetCap: 1.0,           // comprime los golpes para que uno fuerte no tape al resto
    // mezcla
    syncMs: 10,              // desfase tolerado para "en sync"
    newPeakRatio: 0.3,       // cuánto tiene que sobresalir B respecto del perfil aprendido de A
    mixWindowFrac: 1 / 6,    // B se busca a ±1/6 de beat del bombo de A
    baselineMinUpdates: 8,   // ~2 s aprendiendo el perfil de A antes de buscar a B
    driftMsPerSec: 2.5,      // pendiente que cuenta como "derivando"
    driftWindowSec: 3,
    offsetJumpMs: 25,
    dipRatio: 0.75,
    releaseBpm: 1.5,         // tempo medido vs congelado: más que esto y sostenido = cambio de pitch
    releaseUpdates: 4,          // valle mínimo entre los golpes de A y B        // un salto mayor entre lecturas corta la serie de deriva
    mixEnterUpdates: 4,      // ~1 s viendo a B para darlo por entrado
    mixExitSec: 30,          // sin ver a B por este tiempo: vuelve a "solo"
    holdUpdates: { sync: 6, ahead: 4, behind: 4, drift: 6, solo: 4, nolock: 8 },
  };

  // Biquad RBJ
  function biquad(type, f, sr, q) {
    q = q || Math.SQRT1_2;
    const w = 2 * Math.PI * Math.min(f, sr * 0.45) / sr, cw = Math.cos(w), al = Math.sin(w) / (2 * q);
    let b0, b1, b2;
    if (type === 'lp') { b0 = (1 - cw) / 2; b1 = 1 - cw; b2 = (1 - cw) / 2; }
    else { b0 = (1 + cw) / 2; b1 = -(1 + cw); b2 = (1 + cw) / 2; }
    const a0 = 1 + al, a1 = -2 * cw, a2 = 1 - al;
    const B0 = b0 / a0, B1 = b1 / a0, B2 = b2 / a0, A1 = a1 / a0, A2 = a2 / a0;
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    return x => { const y = B0 * x + B1 * x1 + B2 * x2 - A1 * y1 - A2 * y2; x2 = x1; x1 = x; y2 = y1; y1 = y; return y; };
  }

  const median = a => { const s = a.slice().sort((x, y) => x - y); return s[s.length >> 1]; };
  const wrap = (x, n) => ((x % n) + n) % n;
  const circDist = (a, b, n) => { let d = wrap(b - a, n); if (d > n / 2) d -= n; return d; }; // b − a, en (−n/2, n/2]

  /** Envolvente de ataques de una banda: subida de energía en escala log, en un ring buffer. */
  class OnsetBand {
    constructor(size, cap) { this.buf = new Float32Array(size); this.size = size; this.cap = cap; this.logs = [-12, -12, -12, -12]; this.acc = 0; }
    push(frame, n) {
      const l = Math.log10(this.acc / n + 1e-12), L = this.logs;
      const ref = (L[0] + L[1] + L[2] + L[3]) / 4;
      L.pop(); L.unshift(l);
      this.buf[frame % this.size] = Math.min(this.cap, Math.max(0, l - ref));
      this.acc = 0;
    }
    at(abs) { return this.buf[wrap(abs, this.size)]; }
  }

  class PerritoEngine {
    constructor(sampleRate, opts) {
      const c = this.c = Object.assign({}, DEFAULTS, opts || {});
      this.sr = sampleRate;
      this.hop = Math.round(sampleRate * c.hopSec);
      this.fps = sampleRate / this.hop;              // frames reales por segundo
      this.lp1 = biquad('lp', c.lpHz, sampleRate); this.lp2 = biquad('lp', c.lpHz, sampleRate);
      this.hp = biquad('hp', c.hpHz, sampleRate);
      this.hf1 = biquad('hp', c.hfHz, sampleRate); this.hf2 = biquad('hp', c.hfHz, sampleRate);
      this.W = Math.round(c.tempoWindowSec * this.fps);
      this.low = new OnsetBand(this.W, c.onsetCap);
      this.high = new OnsetBand(this.W, c.onsetCap);
      this.n = 0; this.frame = 0;
      this.levelAcc = 0; this.levelN = 0;
      this.updateEvery = Math.round(c.updateSec * this.fps);
      this.reset();
    }

    /** Olvida tempo y mezcla (botón lateral mantenido). */
    reset() {
      this.low.buf.fill(0); this.high.buf.fill(0);
      this.history = [];
      this.result = { bpm: null, confidence: 0, levelDb: -120, state: 'nolock', offsetMs: 0, deltaBpm: 0, mixing: false, beatPhase: 0, time: this.frame / (this.fps || 1) };
      this.aPos = null; this.hfAPos = null; this.mixing = false; this.mixCount = 0; this.lastB = -1e9;
      this.base = new Float32Array(this.c.phaseBins); this.baseN = 0;
      this.offHist = []; this.shownState = 'nolock'; this.candState = null; this.candCount = 0;
      this.framesSinceReset = 0; this.anchor = this.frame;
      this.bpmA = null; this.bpmLog = []; this.releaseCount = 0;
    }

    /** Muestras mono Float32. Devuelve el resultado cuando hay actualización (cada updateSec), si no null. */
    process(buf) {
      let updated = null;
      const low = this.low, high = this.high;
      for (let i = 0; i < buf.length; i++) {
        const x = buf[i];
        this.levelAcc += x * x; this.levelN++;
        const y = this.hp(this.lp2(this.lp1(x)));
        low.acc += y * y;
        const z = this.hf2(this.hf1(x));
        high.acc += z * z;
        if (++this.n === this.hop) {
          low.push(this.frame, this.n); high.push(this.frame, this.n);
          this.frame++; this.framesSinceReset++; this.n = 0;
          if (this.frame % this.updateEvery === 0) updated = this._update();
        }
      }
      return updated;
    }

    _tempo() {
      const c = this.c, fps = this.fps;
      const n = Math.min(this.W, this.framesSinceReset);
      if (n < fps * 4) return null;
      const x = new Float32Array(n);
      let mean = 0;
      for (let i = 0; i < n; i++) { x[i] = this.low.at(this.frame - n + i); mean += x[i]; }
      mean /= n;
      for (let i = 0; i < n; i++) x[i] -= mean;
      const lagMax = Math.min(n - 1, Math.ceil(4 * 60 * fps / c.bpmMin) + 2);
      const acf = new Float32Array(lagMax + 1);
      for (let L = 0; L <= lagMax; L++) {
        let s = 0; for (let i = L; i < n; i++) s += x[i] * x[i - L];
        acf[L] = s / (n - L);
      }
      if (acf[0] <= 0) return null;
      const at = L => { const i = Math.floor(L), f = L - i; return i + 1 > lagMax ? 0 : acf[i] * (1 - f) + acf[i + 1] * f; };
      const Wk = [1, 0.8, 0.6, 0.45];
      let best = -1e9, bestBpm = 0;
      const scores = [];
      for (let bpm = c.bpmMin; bpm <= c.bpmMax + 1e-9; bpm += c.bpmStep) {
        const lag = 60 * fps / bpm;
        let s = 0;
        for (let k = 1; k <= 4; k++) s += Wk[k - 1] * at(k * lag);
        s -= 0.5 * Math.max(0, at(lag / 2)); // un bombo 4/4 no tiene energía a mitad de beat
        scores.push(s);
        if (s > best) { best = s; bestBpm = bpm; }
      }
      const confidence = Math.max(0, Math.min(1, (best - median(scores)) / (2.85 * acf[0])));
      return { bpm: Math.round(bestBpm * 10) / 10, confidence };
    }

    /** Histograma de una banda doblado sobre un beat (suavizado). */
    _fold(band, P) {
      const c = this.c, N = c.phaseBins;
      const k = Math.min(this.framesSinceReset, Math.round(c.phaseWindowSec * this.fps), this.W);
      const h = new Float32Array(N);
      for (let j = 0; j < k; j++) {
        const abs = this.frame - k + j, v = band.at(abs);
        if (!v) continue;
        const pos = wrap(abs - this.anchor, P) / P * N, b = Math.floor(pos), f = pos - b;
        h[b % N] += v * (1 - f); h[(b + 1) % N] += v * f;
      }
      const s = new Float32Array(N);
      for (let i = 0; i < N; i++) s[i] = 0.25 * h[wrap(i - 1, N)] + 0.5 * h[i] + 0.25 * h[(i + 1) % N];
      return s;
    }

    static _peakNear(s, center, radius) {
      const N = s.length; let bi = Math.round(center), bv = -1;
      for (let d = -radius; d <= radius; d++) { const i = wrap(Math.round(center) + d, N); if (s[i] > bv) { bv = s[i]; bi = i; } }
      const a = s[wrap(bi - 1, N)], m = s[bi], b = s[(bi + 1) % N], den = a - 2 * m + b;
      return { pos: wrap(bi + (den ? 0.5 * (a - b) / den : 0), N), v: m };
    }

    _update() {
      const c = this.c, r = this.result, N = c.phaseBins;
      r.levelDb = this.levelN ? 10 * Math.log10(this.levelAcc / this.levelN + 1e-12) : -120;
      this.levelAcc = 0; this.levelN = 0;
      const t = this._tempo();
      const tSec = this.frame / this.fps;
      let raw = 'nolock';

      if (t && t.confidence >= c.minConfidence && r.levelDb > c.levelGateDb) {
        this.history.push(t.bpm); if (this.history.length > c.medianN) this.history.shift();
        const bpm = median(this.history);
        this.bpmLog.push([tSec, bpm]);
        while (this.bpmLog.length && tSec - this.bpmLog[0][0] > 12) this.bpmLog.shift();
        // Si el tempo medido se aleja mucho del congelado, no es una mezcla: es que se movió el pitch.
        if ((this.bpmA != null || this.mixCount > 0) && Math.abs(bpm - (this.bpmA != null ? this.bpmA : r.bpm)) > c.releaseBpm) {
          if (++this.releaseCount >= c.releaseUpdates) {
            this.bpmA = null; this.mixing = false; this.mixCount = 0; this.offHist = [];
            this.baseN = 0; this.base.fill(0); this.hfAPos = null; this.aPos = null; this.releaseCount = 0;
            this.history = [bpm]; r.bpm = bpm;
          }
        } else this.releaseCount = 0;
        if (this.bpmA != null) r.bpm = this.bpmA; // con B sonando, el tempo leído se mezcla: se muestra el de A
        else if (this.mixCount > 0) { /* B apareció y se está confirmando: se sostiene el último valor */ }
        else r.bpm = (r.bpm == null || Math.abs(bpm - r.bpm) > 0.05) ? bpm : r.bpm;
        r.confidence = t.confidence;

        const P = 60 * this.fps / r.bpm, msPerBin = P / N * 1000 / this.fps;
        // el ancla avanza de a beats enteros y queda siempre cerca de "ahora": si el BPM leído
        // oscila un decimal, las posiciones en el histograma casi no se mueven
        this.anchor += Math.floor((this.frame - this.anchor) / P) * P;
        // 1) dónde cae el bombo de A (graves), seguido por continuidad
        const lowH = this._fold(this.low, P);
        let maxI = 0; for (let i = 1; i < N; i++) if (lowH[i] > lowH[maxI]) maxI = i;
        const lowMain = PerritoEngine._peakNear(lowH, maxI, 1);
        const near = Math.max(2, Math.round(c.syncMs * 1.5 / msPerBin));
        if (this.aPos == null) this.aPos = lowMain.pos;
        else {
          const p = PerritoEngine._peakNear(lowH, this.aPos, near); // el bombo de A, aunque B lo tape en graves
          if (p.v > 0.25 * lowMain.v) this.aPos = p.pos;
        }

        // 2) transientes alineados al bombo de A, comparados con el perfil aprendido de A
        const hiH = this._fold(this.high, P);
        // el click de A se sigue en agudos con radio chico: si B está cerca, no lo confunde
        const hiA = this.hfAPos == null || !this.mixCount
          ? PerritoEngine._peakNear(hiH, this.hfAPos == null ? this.aPos : this.hfAPos, this.hfAPos == null ? near : 2)
          : PerritoEngine._peakNear(hiH, this.hfAPos, 1);
        this.hfAPos = hiA.pos;
        let norm = hiA.v; for (let i = 0; i < N; i++) norm = Math.max(norm, hiH[i] * 0.5);
        const shift = Math.round(hiA.pos), frac = hiA.pos - shift;
        const prof = new Float32Array(N);
        for (let i = 0; i < N; i++) prof[i] = hiH[(shift + i) % N] / (norm || 1);

        const win = Math.floor(N * c.mixWindowFrac);
        let bI = 0, bV = 0;
        if (this.baseN >= c.baselineMinUpdates) {
          for (let d = -win; d <= win; d++) {
            if (Math.abs(d - frac) * msPerBin < c.syncMs * 0.8) continue;
            const v = prof[wrap(d, N)] - this.base[wrap(d, N)];
            if (v > bV) { bV = v; bI = d; }
          }
        }

        // B tiene que ser un golpe aparte, con un valle entre él y A (no el golpe de A ensanchado,
        // que es lo que pasa cuando se mueve el pitch de un solo track)
        let distinct = false;
        if (bV >= c.newPeakRatio) {
          const step = bI > 0 ? 1 : -1;
          let dip = Infinity;
          for (let d = step; d !== bI; d += step) dip = Math.min(dip, prof[wrap(d, N)]);
          distinct = dip <= c.dipRatio * prof[wrap(bI, N)];
        }

        if (distinct) {
          const res = d => prof[wrap(d, N)] - this.base[wrap(d, N)];
          const a = res(bI - 1), m = res(bI), b = res(bI + 1), den = a - 2 * m + b;
          const posB = shift + bI + (den ? 0.5 * (a - b) / den : 0);
          const aheadMs = -circDist(hiA.pos, posB, N) * msPerBin; // + = B llega antes que A
          this.lastB = tSec;
          if (this.bpmA == null && this.mixCount + 1 >= c.mixEnterUpdates) { // tempo de A de antes de que entrara B
            const old = this.bpmLog.find(([tt]) => tt >= tSec - c.phaseWindowSec - 1.5);
            this.bpmA = old ? old[1] : r.bpm;
          }
          if (++this.mixCount >= c.mixEnterUpdates) this.mixing = true;
          r.offsetMs = aheadMs;
          const last = this.offHist[this.offHist.length - 1];
          if (last && Math.abs(aheadMs - last[1]) > c.offsetJumpMs) this.offHist = []; // salto: es otro tramo
          this.offHist.push([tSec, aheadMs]);
          while (this.offHist.length && tSec - this.offHist[0][0] > c.driftWindowSec) this.offHist.shift();
          const slope = this._slope(this.offHist);
          if (this.offHist.length >= 8 && Math.abs(slope) > c.driftMsPerSec) {
            raw = 'drift'; r.deltaBpm = slope * r.bpm / 1000; // + = B más rápido (se va adelantando)
          } else raw = aheadMs > 0 ? 'ahead' : 'behind';
        } else {
          this.mixCount = 0; this.offHist = [];
          if (this.mixing && tSec - this.lastB > c.mixExitSec) this.mixing = false;
          if (!this.mixing && tSec - this.lastB > 2) this.bpmA = null;
          if (!this.mixing) { // aprende el perfil propio de A (hats, claps) mientras suena solo
            const k = this.baseN < 4 ? 0.5 : 0.1;
            for (let i = 0; i < N; i++) this.base[i] += k * (prof[i] - this.base[i]);
            this.baseN++;
          }
          raw = this.mixing ? 'sync' : 'solo';
          r.offsetMs = 0;
        }
        // fase del beat "ahora": 0 = cae el bombo de A
        r.beatPhase = wrap(wrap(this.frame - this.anchor, P) / P - this.aPos / N, 1);
      } else {
        this.history = [];
        r.confidence = t ? t.confidence : 0;
      }

      // histéresis: un estado nuevo tiene que sostenerse antes de mostrarse
      if (raw === this.shownState) { this.candState = null; this.candCount = 0; }
      else {
        if (raw === this.candState) this.candCount++; else { this.candState = raw; this.candCount = 1; }
        if (this.candCount >= (c.holdUpdates[raw] || 4)) { this.shownState = raw; this.candState = null; this.candCount = 0; }
      }
      r.state = this.shownState; r.mixing = this.mixing; r.time = tSec;
      return r;
    }

    _slope(pts) {
      const n = pts.length; if (n < 3) return 0;
      let sx = 0, sy = 0, sxx = 0, sxy = 0;
      for (const [x, y] of pts) { sx += x; sy += y; sxx += x * x; sxy += x * y; }
      const d = n * sxx - sx * sx; return d ? (n * sxy - sx * sy) / d : 0;
    }
  }

  PerritoEngine.DEFAULTS = DEFAULTS;
  if (typeof module !== 'undefined' && module.exports) module.exports = PerritoEngine;
  else root.PerritoEngine = PerritoEngine;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
(() => {
  'use strict';
  // ---------- configuración ----------
  const MODES = ['pl', 'bpm', 'mezcla', 'tap'];
  const BG = { pl: '#e8ef59', bpm: '#ed8ac8', mezcla: '#a5dfeb', tap: '#ffb582' }; // los 4 "moods" de perritoslindos.com
  const VIEW = { full: [37.9, -78.2, 484.8, 569.6], tail: [423.05, -54.75, 150, 176.25] };
  const PIVOT = '451.8 106.5';
  const AMP = { normal: 14, happy: 19, stiff: 3 };
  const IDLE_BPM = 120;          // la bienvenida mueve la cola aunque no esté escuchando
  const LATENCY_MS = 35;         // entrada de audio + bloque de análisis
  const TAP_TIMEOUT = 2500;

  const $ = id => document.getElementById(id);
  const app = $('app'), svg = $('dog'), tail = $('tail'), bpmEl = $('bpm'), hint = $('hint');
  const bubble = $('bubble'), bubbleText = $('bubbleText'), dot = $('dot'), toastEl = $('toast');

  // ---------- estado ----------
  let mode = 'pl', listening = false, result = null, tapBpm = null, taps = [];
  let phase = 0, amp = AMP.normal, last = performance.now();
  let view = VIEW.full.slice(), zoom = null;

  // ---------- audio ----------
  const audio = { ctx: null, stream: null, node: null, engine: null, wake: null };

  async function startListening() {
    if (listening) return;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const hooks = window.PerritoBPM || {};
      const ctx = hooks.createContext ? hooks.createContext() : new Ctx();
      let src;
      const sim = window.PerritoBPM && window.PerritoBPM.simulator;
      if (sim) src = sim.start(ctx);                         // solo la demo de escritorio
      else {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: {
          echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
        audio.stream = stream;
        src = ctx.createMediaStreamSource(stream);
      }
      const engine = new PerritoEngine(ctx.sampleRate);
      const onBlock = buf => { const r = engine.process(buf); if (r) onResult(r); };
      let node = null;
      if (ctx.audioWorklet && window.Blob) try {
        const code = `class Tap extends AudioWorkletProcessor{constructor(){super();this.b=new Float32Array(1024);this.n=0}
          process(i){const c=i[0]&&i[0][0];if(c){for(let k=0;k<c.length;k++){this.b[this.n++]=c[k];if(this.n===1024){this.port.postMessage(this.b.slice());this.n=0}}}return true}}
          registerProcessor('perrito-tap',Tap)`;
        const url = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
        await ctx.audioWorklet.addModule(url);
        node = new AudioWorkletNode(ctx, 'perrito-tap');
        node.port.onmessage = e => onBlock(e.data);
      } catch (e) { node = null; }
      if (!node) {                                             // WebViews viejos o sin AudioWorklet
        node = ctx.createScriptProcessor(1024, 1, 1);
        node.onaudioprocess = e => onBlock(e.inputBuffer.getChannelData(0));
      }
      const mute = ctx.createGain(); mute.gain.value = 0;     // el nodo tiene que llegar a destino para correr
      src.connect(node); node.connect(mute); mute.connect(ctx.destination);
      Object.assign(audio, { ctx, node, engine });
      listening = true;
      if (ctx.state === 'suspended') { try { await ctx.resume(); } catch (e) {} }
      try { if (navigator.wakeLock) audio.wake = await navigator.wakeLock.request('screen'); } catch (e) {}
      toast(ctx.state === 'running' ? 'escuchando' : 'tocá la pantalla para activar el audio');
    } catch (err) {
      stopListening();
      toast(location.protocol === 'https:' || location.hostname === 'localhost' ? 'sin permiso de micrófono' : 'el micrófono necesita https');
    }
    render();
  }

  function stopListening() {
    if (audio.stream) audio.stream.getTracks().forEach(t => t.stop());
    const sim = window.PerritoBPM && window.PerritoBPM.simulator;
    if (sim && sim.stop) sim.stop();
    if (audio.ctx) audio.ctx.close().catch(() => {});
    if (audio.wake) audio.wake.release().catch(() => {});
    Object.assign(audio, { ctx: null, stream: null, node: null, wake: null });
    // el motor se conserva: si volvés a escuchar arranca de cero, pero el último BPM queda en pantalla
    audio.engine = null;
    listening = false;
    render();
  }

  function onResult(r) {
    result = Object.assign({}, r);
    if (r.bpm && r.state !== 'nolock') {
      // PLL suave: la cola se engancha al bombo de A
      const target = (r.beatPhase + LATENCY_MS / (60000 / r.bpm)) % 1;
      let d = target - phase; d -= Math.round(d);
      phase = (phase + 0.35 * d + 1) % 1;
    }
    render();
  }

  // ---------- UI ----------
  function shownBpm() {
    if (mode === 'tap') return tapBpm;
    return result && result.bpm && result.state !== 'nolock' ? result.bpm : (result && result.bpm) || null;
  }
  function locked() { return mode === 'tap' ? tapBpm != null : !!(listening && result && result.bpm && result.state !== 'nolock'); }

  function mood() {
    if (mode !== 'mezcla' || !locked()) return 'normal';
    const s = result.state;
    if (s === 'sync') return 'happy';
    if (s === 'ahead' || s === 'behind' || s === 'drift') return 'grr';
    return 'normal';
  }

  function hintText() {
    if (mode === 'tap') return tapBpm == null ? 'tocá la pantalla al ritmo' : `${taps.length} toques · reset abajo`;
    if (!listening) return 'tocá ▶ para escuchar';
    if (!result || !locked()) return result && result.levelDb > -3 ? 'muy fuerte · alejá el teléfono' : 'buscando el bombo…';
    if (mode === 'bpm') return result.levelDb > -3 ? 'muy fuerte · alejá el teléfono' : '';
    const s = result.state, ms = Math.round(Math.abs(result.offsetMs));
    if (s === 'ahead') return `B +${ms} ms · frená`;
    if (s === 'behind') return `B −${ms} ms · empujá`;
    if (s === 'drift') { const d = Math.abs(result.deltaBpm).toFixed(1); return result.deltaBpm > 0 ? `B +${d} BPM · bajá pitch` : `B −${d} BPM · subí pitch`; }
    if (s === 'sync') return 'en fase';
    return 'sonando A · entrá con B';
  }

  function render() {
    app.style.setProperty('--bg', BG[mode]);
    document.querySelector('meta[name=theme-color]').content = BG[mode];
    const m = mood(), welcome = mode === 'pl';
    app.classList.toggle('listening', listening);
    app.classList.toggle('dim', !locked());
    app.classList.toggle('grr', m === 'grr' && !welcome);
    app.classList.toggle('mixing', mode === 'mezcla' && locked() && result.mixing);
    document.querySelectorAll('.welcome').forEach(e => e.classList.toggle('hide', !welcome));
    document.querySelectorAll('.mode').forEach(e => e.classList.toggle('hide', welcome));
    $('phase').classList.toggle('hide', mode !== 'mezcla');
    document.querySelectorAll('#menu span').forEach(s => s.classList.toggle('on', s.dataset.m === mode));
    $('count').textContent = `0${MODES.indexOf(mode) + 1} / 04`;
    $('wHint').textContent = listening ? 'escuchando · deslizá para cambiar' : 'tocá ▶ para escuchar';
    $('earText').textContent = listening ? 'escuchando' : 'pausa';

    const v = shownBpm();
    bpmEl.firstChild.nodeValue = v == null ? '--.-' : v.toFixed(1);
    hint.textContent = welcome ? '' : hintText();

    let want = '';
    if (mode === 'mezcla' && locked()) want = m === 'happy' ? 'barf' : m === 'grr' ? 'grrr' : '';
    if (bubble.dataset.kind !== want) {
      bubble.dataset.kind = want;
      bubble.className = want;
      if (want) { bubbleText.textContent = want === 'barf' ? '¡barf barf!' : 'grrr'; void bubble.offsetWidth; bubble.classList.add('show'); }
    }
    const off = result && mode === 'mezcla' && locked() ? result.offsetMs : 0;
    dot.style.left = (50 + Math.max(-50, Math.min(50, off))) + '%';  // ±50 ms = extremo
  }

  let toastTimer;
  function toast(t) { toastEl.textContent = t; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1100); }

  // ---------- animación ----------
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function zoomTo(target) {
    zoom = { from: view.slice(), to: target, t0: performance.now(), dur: 750 };
  }
  function frame(t) {
    const dt = Math.min(0.1, (t - last) / 1000); last = t;
    // acercamiento entre bienvenida y modos (ancho en escala log para que el zoom se sienta parejo)
    if (zoom) {
      const k = Math.min(1, (t - zoom.t0) / zoom.dur), e = ease(k);
      const lw = Math.log(zoom.from[2]) + (Math.log(zoom.to[2]) - Math.log(zoom.from[2])) * e;
      const w = Math.exp(lw), h = w * 282 / 240;
      // el punto que queda fijo es la base de la cola: así la cola "viaja" a su lugar
      const fx = (451.8 - zoom.from[0]) / zoom.from[2], fy = (106.5 - zoom.from[1]) / zoom.from[3];
      const tx = (451.8 - zoom.to[0]) / zoom.to[2], ty = (106.5 - zoom.to[1]) / zoom.to[3];
      const px = fx + (tx - fx) * e, py = fy + (ty - fy) * e;
      view = [451.8 - px * w, 106.5 - py * h, w, h];
      svg.setAttribute('viewBox', view.map(n => n.toFixed(2)).join(' '));
      if (k >= 1) zoom = null;
    }
    // cola
    const bpm = shownBpm(), on = locked() || mode === 'pl';
    const rate = locked() ? bpm : IDLE_BPM;
    const m = mood();
    const target = !on ? 0 : m === 'happy' ? AMP.happy : m === 'grr' ? AMP.stiff : AMP.normal;
    amp += (target - amp) * Math.min(1, dt * 6);
    if (on) phase = (phase + dt * rate / 60) % 1;
    tail.setAttribute('transform', `rotate(${(amp * Math.cos(2 * Math.PI * phase)).toFixed(2)} ${PIVOT})`);
    requestAnimationFrame(frame);
  }

  // ---------- controles del R1 ----------
  function setMode(next) {
    const was = mode; mode = next;
    if ((was === 'pl') !== (mode === 'pl')) zoomTo(mode === 'pl' ? VIEW.full : VIEW.tail);
    render();
  }
  function wheel(dir) { setMode(MODES[(MODES.indexOf(mode) + dir + MODES.length) % MODES.length]); }

  let lastSide = 0, lastLong = 0;
  function sideClick() {
    const now = performance.now();
    if (now - lastSide < 300 || now - lastLong < 400) return;   // doble evento / suelta de un mantener
    lastSide = now;
    listening ? stopListening() : startListening();
  }
  function longPress() {
    lastLong = performance.now();
    if (audio.engine) audio.engine.reset();
    result = null; tapBpm = null; taps = [];
    toast('tempo reseteado');
    render();
  }
  function tap() {
    if (mode !== 'tap') return;
    const now = performance.now();
    if (taps.length && now - taps[taps.length - 1] > TAP_TIMEOUT) taps = [];
    taps.push(now); if (taps.length > 8) taps.shift();
    phase = 0;
    if (taps.length >= 4) tapBpm = Math.round(600000 / ((taps[taps.length - 1] - taps[0]) / (taps.length - 1))) / 10;
    render();
  }

  // eventos del hardware del R1
  window.addEventListener('sideClick', sideClick);
  window.addEventListener('longPressStart', longPress);
  window.addEventListener('longPressEnd', () => { lastLong = performance.now(); });
  window.addEventListener('scrollUp', () => wheel(-1));
  window.addEventListener('scrollDown', () => wheel(1));
  app.addEventListener('pointerdown', () => {
    if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume().then(() => toast('escuchando')).catch(() => {});
    tap();
  });
  // escritorio: espacio = botón (mantener = reset), flechas o ruedita del mouse = ruedita
  let spaceT = null, spaceLong = false;
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); if (spaceT == null && !e.repeat) { spaceLong = false; spaceT = setTimeout(() => { spaceLong = true; longPress(); }, 600); } }
    if (e.code === 'ArrowUp') { e.preventDefault(); wheel(-1); }
    if (e.code === 'ArrowDown') { e.preventDefault(); wheel(1); }
    if (e.code === 'Enter' && mode === 'tap') tap();
  });
  document.addEventListener('keyup', e => {
    if (e.code !== 'Space') return;
    clearTimeout(spaceT); spaceT = null;
    if (!spaceLong) { lastLong = 0; sideClick(); }
  });
  let wAcc = 0;
  document.addEventListener('wheel', e => { wAcc += e.deltaY; if (Math.abs(wAcc) > 40) { wheel(Math.sign(wAcc)); wAcc = 0; } }, { passive: true });

  // offline: se cachea a sí misma (si el WebView lo soporta)
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});

  window.PerritoBPM = Object.assign(window.PerritoBPM || {}, { sideClick, longPress, wheel, tap });
  Object.defineProperty(window.PerritoBPM, 'state', { get: () => ({ mode, listening, result, tapBpm }) });

  render();
  requestAnimationFrame(frame);
})();
</script>
<!-- Versión táctil para celular. build.js la inserta antes de </body> de la app y genera dist/phone.html.
     La pantalla del R1 (240×282) se escala para llenar el ancho; abajo van los controles que reemplazan
     la ruedita y el botón lateral. Todo pasa por window.PerritoBPM, igual que en la demo. -->
<style>
  html,body{width:100%;height:100%;overflow:hidden;background:var(--page,#e8ef59);transition:background-color .45s ease}
  body{display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #stage{flex:1 1 auto;width:100%;min-height:0;display:flex;justify-content:center;align-items:center;overflow:hidden}
  #app{flex:none;transform-origin:50% 50%;touch-action:manipulation}
  #menu,#count{display:none}

  #pad{flex:none;width:100%;max-width:480px;padding:12px 16px 16px;display:grid;gap:12px;touch-action:manipulation}
  #tabs{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--ink);border-radius:10px;overflow:hidden}
  #tabs button{font:inherit;font-weight:900;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;
    padding:12px 0;border:0;background:transparent;color:var(--ink)}
  #tabs button+button{border-left:2px solid var(--ink)}
  #tabs button.on{background:var(--ink);color:var(--paper)}
  #row{display:grid;grid-template-columns:1fr auto;gap:12px}
  #pad .big{font:inherit;font-weight:900;font-size:20px;letter-spacing:-.3px;padding:18px 12px;border:2px solid var(--ink);
    border-radius:12px;background:var(--ink);color:var(--paper)}
  #pad .big.on{background:var(--paper);color:var(--ink)}
  #reset{font:inherit;font-weight:700;font-size:14px;padding:0 18px;border:2px solid var(--ink);border-radius:12px;
    background:transparent;color:var(--ink)}
  #pad button:active{transform:scale(.97)}
  #status{min-height:18px;margin:-2px 0 0;text-align:center;font-weight:700;font-size:13px;line-height:1.35}
  #status.err{color:#a1001b}
</style>
<div id="pad">
  <div id="tabs">
    <button data-m="pl">pl</button><button data-m="bpm">bpm</button><button data-m="mezcla">mezcla</button><button data-m="tap">tap</button>
  </div>
  <div id="row">
    <button class="big" id="listen">▶ escuchar</button>
    <button id="reset">reset</button>
  </div>
  <p id="status"></p>
</div>
<script>
(() => {
  'use strict';
  const P = window.PerritoBPM, app = document.getElementById('app');
  const stage = document.createElement('div'); stage.id = 'stage';
  app.parentNode.insertBefore(stage, app); stage.appendChild(app);
  const pad = document.getElementById('pad'), listen = document.getElementById('listen');
  const MODES = ['pl', 'bpm', 'mezcla', 'tap'];

  // la pantalla del R1 escalada al lugar libre
  function fit() {
    const s = Math.min(stage.clientWidth / 240, stage.clientHeight / 282);
    app.style.transform = `scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  function goTo(m) {
    const d = (MODES.indexOf(m) - MODES.indexOf(P.state.mode) + MODES.length) % MODES.length;
    if (d) P.wheel(d > 2 ? d - MODES.length : d);
    sync();
  }
  document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => goTo(b.dataset.m)));

  // pantalla despierta mientras escucha (Safari pide que se pida dentro del toque)
  let wake = null;
  listen.addEventListener('click', () => { try { onListen(); } catch (e) { say(`error: ${e && e.message || e}`, true); } });
  function onListen() {
    say('…');
    if (!P) return say(`La app no cargó: ${(window.__errs || []).join(' · ') || 'sin detalle'}`, true);
    const was = P.state.listening;
    if (!was && !(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia))
      return say('Este navegador no deja usar el micrófono. Abrí el link en Safari (no desde WhatsApp, Instagram, etc.).', true);
    P.sideClick();
    if (!was && navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {});
    if (was && wake) { wake.release().catch(() => {}); wake = null; }
    if (!was) { say('pidiendo el micrófono…'); clearTimeout(diag); diag = setTimeout(diagnose, 3000); }
    else say('');
  }

  // estado visible abajo: la app solo muestra un aviso de 1 s y no dice por qué falló
  const status = document.getElementById('status');
  function say(t, err) { status.textContent = t; status.classList.toggle('err', !!err); }
  let diag = null;
  async function diagnose() {
    if (P.state.listening) return say('escuchando');
    try {
      const s = await Promise.race([navigator.mediaDevices.getUserMedia({ audio: true }),
        new Promise((_, no) => setTimeout(() => no({ name: 'Timeout' }), 4000))]);
      s.getTracks().forEach(t => t.stop());
      say('El micrófono anda pero el audio no arrancó. Tocá el perrito una vez y probá de nuevo.', true);
    } catch (e) {
      say(e && e.name === 'NotAllowedError'
        ? 'Sin permiso de micrófono. En Safari: aA (barra de dirección) › Configuración del sitio › Micrófono › Permitir. Después recargá.'
        : e && e.name === 'Timeout'
        ? 'El micrófono no responde: Safari no pidió permiso o quedó esperando. Revisá Ajustes › Apps › Safari › Micrófono y recargá.'
        : `No se pudo abrir el micrófono (${e && e.name || e}).`, true);
    }
  }
  addEventListener('error', e => say(`error: ${e.message}`, true));
  addEventListener('unhandledrejection', e => say(`error: ${(e.reason && (e.reason.message || e.reason.name)) || e.reason}`, true));
  document.getElementById('reset').addEventListener('click', () => P.longPress());

  // deslizar sobre el perrito = girar la ruedita
  let x0 = null;
  app.addEventListener('pointerdown', e => { x0 = e.clientX; });
  app.addEventListener('pointerup', e => {
    if (x0 == null) return;
    const dx = e.clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) { P.wheel(dx < 0 ? 1 : -1); sync(); }
  });

  // los botones siguen el estado de la app (incluye errores de micrófono)
  function sync() {
    if (!P) return;
    const st = P.state;
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.m === st.mode));
    listen.textContent = st.listening ? '■ parar' : '▶ escuchar';
    listen.classList.toggle('on', st.listening);
    if (st.listening && status.textContent === 'pidiendo el micrófono…') say('escuchando');
    document.documentElement.style.setProperty('--page', getComputedStyle(app).getPropertyValue('--bg'));
  }
  setInterval(sync, 200); sync();
  // versión visible al cargar: si no aparece, Safari está mostrando una copia vieja
  if (P) say('versión 10-12 18:49 · tocá ▶ escuchar');
  else say(`La app no cargó: ${(window.__errs || []).join(' · ') || 'sin detalle'}`, true);
})();
</script>
